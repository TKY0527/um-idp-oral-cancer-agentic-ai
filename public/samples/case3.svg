<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="White patch on lateral tongue">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3edff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="lipGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdb4cb"/>
      <stop offset="100%" stop-color="#e08aab"/>
    </radialGradient>
    <radialGradient id="whitePatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f5efe5"/>
      <stop offset="100%" stop-color="#dcd2bd"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <ellipse cx="200" cy="160" rx="140" ry="80" fill="url(#lipGrad3)"/>
  <ellipse cx="200" cy="170" rx="115" ry="55" fill="#7a1e3a"/>
  <!-- Tongue -->
  <ellipse cx="200" cy="195" rx="85" ry="35" fill="#e07692"/>
  <ellipse cx="200" cy="190" rx="75" ry="28" fill="#d96581" opacity="0.7"/>
  <!-- White patch on lateral tongue (left side) -->
  <path d="M 130 195 Q 138 178 158 180 Q 168 188 162 205 Q 148 215 132 208 Q 124 202 130 195 Z"
        fill="url(#whitePatch)" stroke="#b5a78a" stroke-width="1.2"/>
  <!-- Pointer -->
  <line x1="100" y1="240" x2="142" y2="200" stroke="#5d35a3" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="100" cy="240" r="3" fill="#5d35a3"/>
  <text x="96" y="255" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#5d35a3" font-weight="600">white patch</text>
  <!-- Teeth top -->
  <g fill="#fffdf5">
    <rect x="138" y="123" width="14" height="24" rx="3"/>
    <rect x="156" y="121" width="14" height="26" rx="3"/>
    <rect x="174" y="120" width="14" height="27" rx="3"/>
    <rect x="192" y="120" width="14" height="27" rx="3"/>
    <rect x="210" y="120" width="14" height="27" rx="3"/>
    <rect x="228" y="121" width="14" height="26" rx="3"/>
    <rect x="246" y="123" width="14" height="24" rx="3"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#4a2d82">
    <rect x="14" y="14" width="160" height="28" rx="14" fill="#ef4444"/>
    <text x="94" y="33" text-anchor="middle" fill="white" font-weight="600">Case 3 · White patch (High)</text>
  </g>
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5d35a3">Lateral tongue · persistent white patch · 5 weeks</text>
</svg>
