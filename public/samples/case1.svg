<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Normal oral cavity illustration">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3edff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="lipGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdb4cb"/>
      <stop offset="100%" stop-color="#e08aab"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  <!-- Mouth opening -->
  <ellipse cx="200" cy="160" rx="140" ry="80" fill="url(#lipGrad1)"/>
  <ellipse cx="200" cy="170" rx="115" ry="55" fill="#7a1e3a"/>
  <!-- Tongue -->
  <ellipse cx="200" cy="195" rx="85" ry="35" fill="#e07692"/>
  <ellipse cx="200" cy="190" rx="75" ry="28" fill="#d96581" opacity="0.7"/>
  <!-- Teeth top -->
  <g fill="#fffdf5">
    <rect x="120" y="125" width="14" height="22" rx="3"/>
    <rect x="138" y="123" width="14" height="24" rx="3"/>
    <rect x="156" y="121" width="14" height="26" rx="3"/>
    <rect x="174" y="120" width="14" height="27" rx="3"/>
    <rect x="192" y="120" width="14" height="27" rx="3"/>
    <rect x="210" y="120" width="14" height="27" rx="3"/>
    <rect x="228" y="121" width="14" height="26" rx="3"/>
    <rect x="246" y="123" width="14" height="24" rx="3"/>
    <rect x="264" y="125" width="14" height="22" rx="3"/>
  </g>
  <!-- Teeth bottom -->
  <g fill="#fffdf5">
    <rect x="130" y="225" width="13" height="18" rx="3"/>
    <rect x="148" y="227" width="13" height="18" rx="3"/>
    <rect x="166" y="228" width="13" height="18" rx="3"/>
    <rect x="184" y="228" width="13" height="19" rx="3"/>
    <rect x="202" y="228" width="13" height="19" rx="3"/>
    <rect x="220" y="228" width="13" height="18" rx="3"/>
    <rect x="238" y="227" width="13" height="18" rx="3"/>
    <rect x="256" y="225" width="13" height="18" rx="3"/>
  </g>
  <!-- Label -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#4a2d82">
    <rect x="14" y="14" width="118" height="28" rx="14" fill="#a474f5"/>
    <text x="73" y="33" text-anchor="middle" fill="white" font-weight="600">Case 1 · Normal</text>
  </g>
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5d35a3">No suspicious lesion · routine screening</text>
</svg>
