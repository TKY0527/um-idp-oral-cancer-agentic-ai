<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Persistent ulcer-like lesion on inner cheek">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3edff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="lipGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdb4cb"/>
      <stop offset="100%" stop-color="#e08aab"/>
    </radialGradient>
    <radialGradient id="ulcer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="60%" stop-color="#fde6c8"/>
      <stop offset="100%" stop-color="#c44a4a"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <ellipse cx="200" cy="160" rx="140" ry="80" fill="url(#lipGrad2)"/>
  <ellipse cx="200" cy="170" rx="115" ry="55" fill="#7a1e3a"/>
  <!-- Tongue -->
  <ellipse cx="200" cy="195" rx="85" ry="35" fill="#e07692"/>
  <!-- Inner cheek area highlight -->
  <ellipse cx="100" cy="170" rx="35" ry="30" fill="#c0506b" opacity="0.6"/>
  <!-- Ulcer lesion -->
  <ellipse cx="100" cy="170" rx="14" ry="11" fill="url(#ulcer)" stroke="#a83838" stroke-width="1.5"/>
  <!-- Pointer -->
  <line x1="80" y1="120" x2="98" y2="160" stroke="#5d35a3" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="80" cy="120" r="3" fill="#5d35a3"/>
  <text x="76" y="115" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#5d35a3" font-weight="600">ulcer-like</text>
  <!-- Teeth top -->
  <g fill="#fffdf5">
    <rect x="138" y="123" width="14" height="24" rx="3"/>
    <rect x="156" y="121" width="14" height="26" rx="3"/>
    <rect x="174" y="120" width="14" height="27" rx="3"/>
    <rect x="192" y="120" width="14" height="27" rx="3"/>
    <rect x="210" y="120" width="14" height="27" rx="3"/>
    <rect x="228" y="121" width="14" height="26" rx="3"/>
    <rect x="246" y="123" width="14" height="24" rx="3"/>
  </g>
  <g fill="#fffdf5">
    <rect x="148" y="227" width="13" height="18" rx="3"/>
    <rect x="166" y="228" width="13" height="18" rx="3"/>
    <rect x="184" y="228" width="13" height="19" rx="3"/>
    <rect x="202" y="228" width="13" height="19" rx="3"/>
    <rect x="220" y="228" width="13" height="18" rx="3"/>
    <rect x="238" y="227" width="13" height="18" rx="3"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#4a2d82">
    <rect x="14" y="14" width="148" height="28" rx="14" fill="#f59e0b"/>
    <text x="88" y="33" text-anchor="middle" fill="white" font-weight="600">Case 2 · Ulcer (Medium)</text>
  </g>
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5d35a3">Inner cheek · ulcer-like appearance · 3 weeks</text>
</svg>
